plugins { id 'com.android.application' }

android {
    namespace 'pe.tachorojo.app'
    compileSdk 34
    defaultConfig {
        applicationId 'pe.tachorojo.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Copia la app web (../frontend) dentro del APK antes de compilar.
tasks.register('copyWeb', Copy) {
    from "${rootDir}/../frontend"
    into "${projectDir}/src/main/assets"
    exclude 'README.md'
}
preBuild.dependsOn 'copyWeb'

dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
